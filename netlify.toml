# Configuração da Netlify – site estático, sem build.
[build]
  publish = "."

# HTML, CSS e JS já saem da Netlify sem cache longo (max-age=0, must-revalidate),
# então qualquer alteração aparece na hora.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Fotos, logo e ícones: cache de 7 dias
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
